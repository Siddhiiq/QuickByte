#############################################
# Application
#############################################

spring.application.name=QuickByte


#############################################
# PostgreSQL Database
#############################################

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/QuickByte}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


#############################################
# JPA / Hibernate
#############################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#############################################
# Server
#############################################

server.port=8080


#############################################
# JWT
#############################################

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


#############################################
# Spring Security Logging
#############################################

logging.level.org.springframework.security=DEBUG


#############################################
# Email
#############################################

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


#############################################
# Swagger / OpenAPI
#############################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


#############################################
# Logging
#############################################

logging.level.root=INFO
logging.level.com.quickbyte=DEBUG

logging.file.name=logs/quickbyte.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n


#############################################
# Redis
#############################################

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}


#############################################
# File Upload
#############################################

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


#############################################
# Cloudinary
#############################################

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}